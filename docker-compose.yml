version: '3.8'
services:
  biance-alpha-address-monitor:
    build: 
      context: .
      args:
        - HTTP_PROXY=
        - HTTPS_PROXY=
    container_name: biance-alpha-address-monitor
    volumes:
      - type: bind
        source: .
        target: /app
    environment:
      - TZ=Asia/Shanghai
      - ENV=prod
      - IS_DOCKER=true
      - HTTP_PROXY=http://host.docker.internal:7890
      - HTTPS_PROXY=http://host.docker.internal:7890

      # Twitter API配置
      - TWITTER_API_BASE_URL=http://twitter-api:8008
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: '0.5gb'
    restart: always
    networks:
      - app-network
      
  # Twitter API模拟服务
  twitter-api:
    image: node:16-alpine
    container_name: twitter-api
    ports:
      - "8008:8008"
    volumes:
      - ./twitter-api:/app
    working_dir: /app
    command: sh -c "npm install && npm start"
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    external: true    # 声明使用外部网络
    name: shared-network  # 使用my-redis-bot容器所在的网络名称